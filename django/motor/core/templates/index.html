<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Página Inicial</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 50px;
      text-align: center;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      color: #333;
      margin: 20px 0;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      font-size: 18px;
      text-decoration: none;
      color: #0077cc;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Título da página -->
    <h1>Funcionando!</h1>
    <h1>Contato</h1>

    <!-- Link para a página de contato -->
    <a href="/contato">Entre em contato</a>
  </div>

</body>
</html>
