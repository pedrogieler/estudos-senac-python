        <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Página de Contato</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 50px;
      text-align: center;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      color: #333;
    }

    p {
      font-size: 18px;
      margin: 10px 0;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #0077cc;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Página de Contato</h1>
    <p><strong>Empresa:</strong> {{ nome }}</p>
    <p><strong>Telefone:</strong> {{ fone }}</p>
    <p><strong>E-mail:</strong> {{ email }}</p>
    <a href="/">Voltar</a> <BR>
    <a href="/admin">+++</a>
  </div>

</body>
</html>

    </body>
    </html>
